server:
  port: 8082

spring:
  application:
    name: token-exchange-service
  datasource:
    url: jdbc:postgresql://localhost:5432/exchange
    username: postgres
    password: postgres
  flyway:
    locations: classpath:db/migration

lab:
  # "iss" del token propio: URL publica a traves del proxy, no la interna del contenedor.
  issuer: http://localhost/token
  access-token-ttl: 10m
  session-idle: 30m
  session-absolute: 12h
  default-audience: documents-api
  cookies-secure: true
  # Habilita POST /token/admin/rotate-keys. Solo para el laboratorio.
  admin-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    co.com.lab: INFO
